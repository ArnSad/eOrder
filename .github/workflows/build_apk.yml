name: Build Marg eOrder Android APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Find Project Directory
        id: dir
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "APP_DIR=." >> $GITHUB_ENV
            echo "Found pubspec.yaml in root repository."
          else
            FOUND=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              APP_DIR=$(dirname "$FOUND")
              echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
              echo "Found pubspec.yaml in subfolder: $APP_DIR"
            else
              echo "APP_DIR=." >> $GITHUB_ENV
            fi
          fi

      - name: Ensure Android Native Scaffolding
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Scaffolding missing Android Gradle files..."
            flutter create . --platforms=android --org com.marg.eorder
          else
            echo "Android native configuration found."
          fi

      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter build apk --release --no-tree-shake-icons --extra-front-end-options=--enable-experiment=dot-shorthands || flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: marg-eorder-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
