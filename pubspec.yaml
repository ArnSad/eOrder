name: marg_eorder
description: "Android field sales order application inspired by Marg eOrder for distributors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Robust Offline SQLite Relational Storage
  sqflite: ^2.3.3+1

  # File and database path utilities
  path: ^1.9.0

  # Lightweight Key-Value Storage for credentials and sync metadata
  shared_preferences: ^2.2.3

  # Network HTTP Client for Marg ERP synchronization
  http: ^1.2.1

  # Unique ID generator for offline orders and items
  uuid: ^4.4.0

  # Excel Spreadsheet Generation (.xlsx)
  excel: ^2.1.0

  # Native OS File Share & Email Utility
  share_plus: ^9.0.0

  # Application file directories
  path_provider: ^2.1.3

  # UI Icons & Cupertino
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
